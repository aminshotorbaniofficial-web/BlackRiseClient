name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

env:
  SING_BOX_VERSION: v1.8.13

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'
          cache: false

      - name: Install Android NDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;26.2.11394342" "platforms;android-34"

      - name: Build libbox.aar (sing-box core)
        run: |
          git clone --depth 1 --branch "$SING_BOX_VERSION" https://github.com/SagerNet/sing-box.git /tmp/sing-box
          cd /tmp/sing-box
          GM_VERSION="$(go list -m -f '{{.Version}}' github.com/sagernet/gomobile)"
          echo "Using gomobile $GM_VERSION"
          go install -v github.com/sagernet/gomobile/cmd/gomobile@$GM_VERSION
          go install -v github.com/sagernet/gomobile/cmd/gobind@$GM_VERSION
          export PATH="$PATH:$(go env GOPATH)/bin"
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/26.2.11394342"
          go run ./cmd/internal/build_libbox
